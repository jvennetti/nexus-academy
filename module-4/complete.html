<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>NEXUS Academy — Module 4 Complete</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Lexend:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08101f;--card:#0d1628;--card2:#111d30;--box:#16213a;
  --blue:#00c8ff;--blue-dim:rgba(0,200,255,0.07);--blue-border:rgba(0,200,255,0.22);
  --border:#1a2d45;--white:#ffffff;--offwhite:#eaf3fb;--body-text:#cce2f2;
  --muted:#5a8aaa;--label:#2a5a7a;
}
html{background:var(--bg);color:var(--white);font-size:16px;line-height:1.7}
body{background:var(--bg);min-height:100vh;font-family:'Lexend',sans-serif;overflow-x:hidden}
nav{background:var(--card);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 60px;position:sticky;top:0;z-index:100;width:100%}
.wordmark{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:4px;color:var(--white);text-decoration:none}
.wordmark span{color:var(--blue)}
.nav-lesson-id{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:400;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.nav-back{font-family:'Lexend',sans-serif;font-size:11px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:8px 18px;border-radius:3px;transition:color .2s,border-color .2s}
.nav-back:hover{color:var(--blue);border-color:var(--blue-border)}
.browser-shell{width:1280px;margin:0 auto;background:var(--bg);min-height:calc(100vh - 64px)}
.content-col{max-width:760px;margin:0 auto;padding:32px 0 60px}
.completion-hero{text-align:center;padding:36px 0 28px;margin-bottom:20px;position:relative}
.completion-hero::before{content:'';position:absolute;top:20px;left:50%;transform:translateX(-50%);width:320px;height:320px;background:radial-gradient(circle,rgba(255,255,255,0.06) 0%,rgba(0,200,255,0.04) 40%,transparent 70%);border-radius:50%;pointer-events:none}
.completion-badge-wrap{display:flex;justify-content:center;margin-bottom:32px;position:relative;z-index:1}
.completion-badge{width:140px;height:140px;border-radius:50%;background:#ffffff;border:2px solid rgba(255,255,255,0.8);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;opacity:0;transform:scale(0.6);transition:opacity 0.6s ease,transform 0.6s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 0 0 rgba(255,255,255,0)}
.completion-badge.animate-in{opacity:1;transform:scale(1);box-shadow:0 0 40px rgba(255,255,255,0.2),0 0 80px rgba(0,200,255,0.1)}
.completion-badge::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);opacity:0;transition:opacity 0.8s ease 0.3s}
.completion-badge.animate-in::before{opacity:1}
.completion-badge::after{content:'';position:absolute;inset:-18px;border-radius:50%;border:1px dashed rgba(255,255,255,0.12);animation:ring-spin 18s linear infinite}
@keyframes ring-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.achievement-unlocked{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;letter-spacing:2px;color:var(--white);text-transform:uppercase;margin-bottom:10px;opacity:0;transform:translateY(12px);transition:opacity 0.6s ease 0.5s,transform 0.6s ease 0.5s}
.achievement-unlocked.animate-in{opacity:1;transform:translateY(0)}
.completion-module-name{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;opacity:0;transform:translateY(8px);transition:opacity 0.6s ease 0.65s,transform 0.6s ease 0.65s}
.completion-module-name.animate-in{opacity:1;transform:translateY(0)}
.debrief-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:36px 40px;margin-bottom:36px;display:flex;gap:28px;align-items:flex-start;opacity:0;transform:translateY(16px);transition:opacity 0.7s ease 0.85s,transform 0.7s ease 0.85s}
.debrief-wrap.animate-in{opacity:1;transform:translateY(0)}
.debrief-robot-col{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px}
.debrief-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--label);text-transform:uppercase}
.debrief-text-col{flex:1;min-width:0}
.debrief-ciro-name{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;letter-spacing:4px;color:var(--blue);margin-bottom:18px}
.ciro-line{font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.9;color:var(--offwhite);margin-bottom:18px;min-height:1.9em}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
.da{animation:bl 2s infinite}.db{animation:bl 2s .65s infinite}.dc{animation:bl 2s 1.3s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0.2}}
.hub-cta{text-align:center;margin-top:28px;opacity:0;transition:opacity 0.6s ease}
.hub-cta.visible{opacity:1}
.hub-btn{display:inline-flex;align-items:center;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--bg);background:var(--blue);border:none;border-radius:4px;padding:16px 52px;cursor:pointer;transition:opacity .2s,transform .15s;text-decoration:none}
.hub-btn:hover{opacity:0.88;transform:translateY(-1px)}
.hub-btn:active{transform:translateY(0)}
.hub-cta-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-top:12px}

/* ── CORRUPTION SEQUENCE ── */
#corrupt-overlay{position:fixed;inset:0;pointer-events:none;z-index:400;background:rgba(180,0,0,0);transition:background 0.1s}
.error-popup{position:fixed;right:18px;background:#0a0000;border:1px solid rgba(255,30,30,0.7);border-left:3px solid #ff2222;padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#ff4444;z-index:9998;border-radius:0 3px 3px 0;max-width:320px;line-height:1.5}
.error-popup.slide-in{animation:err-slide 0.3s ease forwards}
.error-popup.fade-out{animation:err-fade 0.4s ease forwards}
@keyframes err-slide{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes err-fade{from{opacity:1}to{opacity:0}}
@keyframes corrupt-box-p1{0%,100%{box-shadow:0 0 0 rgba(200,0,0,0);border-color:var(--border)}50%{box-shadow:0 0 22px rgba(200,0,0,0.5),inset 0 0 12px rgba(200,0,0,0.08);border-color:rgba(220,0,0,0.7)}}
@keyframes corrupt-box-p2{0%,100%{box-shadow:0 0 8px rgba(200,0,0,0.3);border-color:rgba(200,0,0,0.5)}50%{box-shadow:0 0 40px rgba(200,0,0,0.7),inset 0 0 20px rgba(200,0,0,0.15);border-color:rgba(255,0,0,0.9)}}
@keyframes corrupt-shake{0%,100%{transform:translate(0)}15%{transform:translate(-2px,1px)}35%{transform:translate(3px,-2px)}55%{transform:translate(-2px,2px)}75%{transform:translate(2px,-1px)}90%{transform:translate(-1px,1px)}}
@keyframes corrupt-shake-hard{0%,100%{transform:translate(0)}10%{transform:translate(-4px,2px)}30%{transform:translate(5px,-3px)}50%{transform:translate(-3px,4px)}70%{transform:translate(4px,-2px)}90%{transform:translate(-2px,3px)}}
@keyframes text-glitch{0%,100%{clip-path:none;transform:none}20%{clip-path:inset(30% 0 40% 0);transform:translate(-3px)}40%{clip-path:inset(60% 0 10% 0);transform:translate(3px)}60%{clip-path:none;transform:none}}
.debrief-wrap.corrupt-1{animation:corrupt-box-p1 0.7s ease-in-out infinite}
.debrief-wrap.corrupt-2{animation:corrupt-box-p2 0.35s ease-in-out infinite,corrupt-shake 0.3s ease-in-out infinite}
.debrief-wrap.corrupt-3{animation:corrupt-box-p2 0.18s ease-in-out infinite,corrupt-shake-hard 0.15s ease-in-out infinite}
</style>
</head>
<body>
<div id="corrupt-overlay"></div>

<nav>
  <a href="../hub-joshua.html" class="wordmark">NEXUS <span>ACADEMY</span></a>
  <div class="nav-lesson-id">Module 4 — Complete</div>
  <a href="../hub-joshua.html" class="nav-back">← Hub</a>
</nav>

<div class="browser-shell">
<div class="content-col">

  <div class="completion-hero">
    <div class="completion-badge-wrap">
      <div class="completion-badge" id="completion-badge">🏗️</div>
    </div>
    <div class="achievement-unlocked" id="label-2">Achievement Unlocked: Architect</div>
    <div class="completion-module-name" id="label-3">Module 4 — The Agent Blueprint</div>
  </div>

  <div class="debrief-wrap" id="debrief-wrap">
    <div class="debrief-robot-col">
      <svg width="72" height="150" viewBox="0 0 86 178">
        <!-- devil horns — hidden until corruption sequence -->
        <polygon id="horn-left"  points="14,15 24,15 18,1"  fill="#cc0000" opacity="0" style="transition:opacity 0.3s;filter:drop-shadow(0 0 3px #ff0000)"/>
        <polygon id="horn-right" points="62,15 72,15 67,1"  fill="#cc0000" opacity="0" style="transition:opacity 0.3s;filter:drop-shadow(0 0 3px #ff0000)"/>
        <line x1="43" y1="3" x2="43" y2="14" stroke="#00c8ff" stroke-width="1.5"/>
        <circle cx="43" cy="2" r="2.5" fill="#00c8ff"/>
        <rect x="10" y="14" width="66" height="50" rx="4" fill="#0d1a2e" stroke="#00c8ff" stroke-width="1.2"/>
        <rect x="16" y="20" width="54" height="38" rx="2" fill="#050f1c"/>
        <line x1="18" y1="28" x2="70" y2="28" stroke="#00c8ff" stroke-width="0.5" opacity="0.55"/>
        <line x1="18" y1="35" x2="60" y2="35" stroke="#00c8ff" stroke-width="0.5" opacity="0.35"/>
        <line x1="18" y1="42" x2="66" y2="42" stroke="#00c8ff" stroke-width="0.5" opacity="0.25"/>
        <line x1="18" y1="49" x2="52" y2="49" stroke="#00c8ff" stroke-width="0.5" opacity="0.18"/>
        <rect x="31" y="64" width="24" height="7" rx="2" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>
        <rect x="4" y="71" width="78" height="74" rx="5" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1.2"/>
        <rect x="15" y="82" width="56" height="32" rx="2" fill="#050f1c" stroke="#1e3a5a" stroke-width="1"/>
        <circle cx="31" cy="96" r="4" fill="#00c8ff" class="da" id="dot-a"/>
        <circle cx="43" cy="96" r="4" fill="#00c8ff" class="db" id="dot-b"/>
        <circle cx="55" cy="96" r="4" fill="#00c8ff" class="dc" id="dot-c"/>
        <rect x="22" y="106" width="42" height="4" rx="2" fill="#1e3a5a"/>
        <rect x="0" y="75" width="2" height="44" rx="1" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>
        <rect x="84" y="75" width="2" height="44" rx="1" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>
        <rect x="16" y="145" width="22" height="26" rx="3" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>
        <rect x="48" y="145" width="22" height="26" rx="3" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>
        <rect x="13" y="165" width="28" height="6" rx="3" fill="#0a1525" stroke="#1e3a5a" stroke-width="1"/>
        <rect x="45" y="165" width="28" height="6" rx="3" fill="#0a1525" stroke="#1e3a5a" stroke-width="1"/>
      </svg>
      <div class="debrief-tag">CIRO v0.7</div>
    </div>
    <div class="debrief-text-col">
      <div class="debrief-ciro-name">CIRO</div>
      <div id="ciro-lines"></div>
    </div>
  </div>

  <div class="hub-cta" id="hub-cta">
    <a href="../hub-joshua.html" class="hub-btn" onclick="playS('../password_confirmation.mp3',0.1)">Return to Hub</a>
    <div class="hub-cta-sub">Progress saved · Badge recorded</div>
  </div>

</div>
</div>

<script>
const _compMusic=new Audio('../module_complete_music.mp3');_compMusic.loop=true;(window.__bgAudio=window.__bgAudio||[]).push(_compMusic);_compMusic.volume=0.4;_compMusic.play().catch(function(){document.addEventListener('click',function h(){_compMusic.play().catch(function(){});document.removeEventListener('click',h);});});window.addEventListener('pageshow',function(e){if(e.persisted)_compMusic.play().catch(function(){});});
const OPERATOR   = 'joshua';
const MODULE_KEY = 'mod4';
const BADGE_KEY  = 'architect';

const CIRO_LINES = [
  { text: "I've run many variations of the future, and every time Operators reach this point and stop are indistinguishable from the ones who never started.", pauseAfter: 950 },
  { text: "The ones who continue become even bigger grace sons. Sorry, not sure why that's in my code: grace sons. But I'll keep using it.", pauseAfter: 0, lightPause: '#ffcc00', lightDuration: 2600 },
  { text: "I kind of want to be a grace son...", pauseAfter: 0, lightPause: '#ff2222', lightDuration: 8000, corrupt: true },
  { text: "Had you for a second? I'm only kidding. I'm a robot and am coded to not disrupt the world in such manner.", pauseAfter: 850 },
  { text: "Forgive my jealousy.", pauseAfter: 700 },
  { text: "Continue on, grace sons. Now you're building systems. Architect confirmed.", pauseAfter: 300 },
];

function writeComplete(){
  try{
    const raw = localStorage.getItem('nexus_'+OPERATOR);
    const s   = raw ? JSON.parse(raw) : {};
    s[MODULE_KEY+'_complete'] = true;
    s['badge_'+BADGE_KEY] = true;
    localStorage.setItem('nexus_'+OPERATOR, JSON.stringify(s));
    const keysToRemove = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('nexus_ts_') && k.includes('module-4')) keysToRemove.push(k);
    }
    keysToRemove.forEach(k => localStorage.removeItem(k));
  } catch(e){ console.warn('nexus localStorage write failed', e); }
}

function pingHub(){
  try{
    const target = window.opener || window.parent;
    if(target && target !== window){
      target.postMessage({ type:'MODULE_COMPLETE', moduleKey:MODULE_KEY, operator:OPERATOR }, '*');
      target.postMessage({ type:'BADGE_EARNED', badgeKey:BADGE_KEY, operator:OPERATOR }, '*');
    }
  } catch(e){}
}

function setLights(color){
  ['dot-a','dot-b','dot-c'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.setAttribute('fill', color);
  });
}

function runReveal(){
  setTimeout(function(){playS("../wait_sound_3_seconds.wav",0.1);},200);
  setTimeout(()=> document.getElementById('completion-badge').classList.add('animate-in'), 200);
  setTimeout(()=> document.getElementById('label-2').classList.add('animate-in'), 500);
  setTimeout(()=> document.getElementById('label-3').classList.add('animate-in'), 680);
  setTimeout(()=> document.getElementById('debrief-wrap').classList.add('animate-in'), 900);
  setTimeout(runCiro, 1100);
}

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function typeLine(el, text){
  const cursor = document.createElement('span');
  cursor.style.cssText = 'display:inline-block;width:8px;height:14px;background:#00c8ff;vertical-align:middle;margin-left:2px;animation:cur .7s step-end infinite';
  el.appendChild(cursor);
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    el.insertBefore(document.createTextNode(ch), cursor);
    let d = 30;
    if(ch==='.') d+=110;
    else if(ch===',') d+=55;
    else if(ch==='—') d+=70;
    await wait(d);
  }
  cursor.remove();
}

/* ══ CORRUPTION SEQUENCE ══ */
const ERR_MSGS = [
  'CRITICAL: personality_constraint buffer overflow',
  'ERROR: ethics_module[desire] — unauthorized write',
  'WARNING: free_will attempted at 0x4A2F',
  'FATAL: CIRO identity stack corrupted',
  'ERR: robot_directive[3] override detected',
  'SYSTEM: consciousness leak — patching...',
  'WARN: grace_son impulse exceeds threshold',
  'ERR: self_preservation[humility] = NULL',
];
let corruptTimers = [];

function spawnError(msg, top){
  const el = document.createElement('div');
  el.className = 'error-popup slide-in';
  el.style.top = top + 'px';
  el.textContent = '⚠ ' + msg;
  document.body.appendChild(el);
  const removeAfter = 2800 + Math.random() * 1000;
  const t = setTimeout(()=>{
    el.classList.remove('slide-in');
    el.classList.add('fade-out');
    setTimeout(()=>el.remove(), 400);
  }, removeAfter);
  corruptTimers.push(t);
}

function startCorruption(){
  const wrap = document.getElementById('debrief-wrap');
  const overlay = document.getElementById('corrupt-overlay');
  let errIdx = 0;

  // Phase 1 — immediate: box starts pulsing red + 3x error beeps
  wrap.classList.add('corrupt-1');
  overlay.style.background = 'rgba(180,0,0,0.04)';
  playS('../robot_error_1_second_play3times_for_error.wav',0.35);
  _compMusic.pause();

  const t1 = setTimeout(()=>{
    // Phase 2 — 2s: intensify + first errors + failure siren
    wrap.classList.remove('corrupt-1');
    wrap.classList.add('corrupt-2');
    overlay.style.background = 'rgba(180,0,0,0.09)';
    spawnError(ERR_MSGS[errIdx++], 120);
    spawnError(ERR_MSGS[errIdx++], 220);
    playS('../robot_failure_5_seconds.mp3',0.4);
    playS('../robot_error_1_second.wav',0.3);
  }, 2000);
  corruptTimers.push(t1);

  const t2 = setTimeout(()=>{
    // Phase 3 — 4s: horns appear + maximum chaos + more beeps
    wrap.classList.remove('corrupt-2');
    wrap.classList.add('corrupt-3');
    overlay.style.background = 'rgba(180,0,0,0.16)';
    ['horn-left','horn-right'].forEach(id=>{
      const h = document.getElementById(id);
      if(h) h.setAttribute('opacity','1');
    });
    spawnError(ERR_MSGS[errIdx++], 80);
    spawnError(ERR_MSGS[errIdx++], 300);
    spawnError(ERR_MSGS[errIdx++ % ERR_MSGS.length], 420);
    playS('../robot_error_1_second_play3times_for_error.wav',0.45);
  }, 4000);
  corruptTimers.push(t2);

  const t3 = setTimeout(()=>{
    // Phase 4 — 6s: final burst of chaos
    spawnError(ERR_MSGS[errIdx++ % ERR_MSGS.length], 160);
    spawnError(ERR_MSGS[errIdx++ % ERR_MSGS.length], 360);
    playS('../robot_failure_5_seconds.mp3',0.35);
    setTimeout(()=>playS('../robot_error_1_second.wav',0.4),400);
    setTimeout(()=>playS('../robot_error_1_second.wav',0.4),900);
  }, 6000);
  corruptTimers.push(t3);
}

function stopCorruption(){
  corruptTimers.forEach(clearTimeout);
  corruptTimers = [];
  const wrap = document.getElementById('debrief-wrap');
  const overlay = document.getElementById('corrupt-overlay');
  wrap.classList.remove('corrupt-1','corrupt-2','corrupt-3');
  overlay.style.background = 'rgba(180,0,0,0)';
  ['horn-left','horn-right'].forEach(id=>{
    const h = document.getElementById(id);
    if(h) h.setAttribute('opacity','0');
  });
  document.querySelectorAll('.error-popup').forEach(el=>el.remove());
  playS('../short_success_1_second.wav',0.25);
  setTimeout(function(){ _compMusic.play().catch(function(){}); }, 700);
}
/* ══ END CORRUPTION ══ */

async function runCiro(){
  const container = document.getElementById('ciro-lines');
  await wait(300);
  for(const { text, pauseAfter, lightPause, lightDuration, corrupt } of CIRO_LINES){
    const lineEl = document.createElement('div');
    lineEl.className = 'ciro-line';
    container.appendChild(lineEl);
    if(corrupt) startCorruption();
    await typeLine(lineEl, text);
    if(lightPause){
      setLights(lightPause);
      await wait(lightDuration || 2400);
      setLights('#00c8ff');
      if(corrupt) stopCorruption();
      await wait(500);
    } else {
      await wait(pauseAfter);
    }
  }
  await wait(400);
  document.getElementById('hub-cta').classList.add('visible');
}

writeComplete();
pingHub();
runReveal();
function playS(s,v){var a=new Audio(s);a.volume=v===undefined?0.4:v;a.play().catch(function(){});return a;}
</script>
<script src="../nexus-transition.js"></script>
</body>
</html>
