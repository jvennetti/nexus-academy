<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>NEXUS Academy — Pre-Course Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Lexend:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08101f;--card:#0d1628;--card2:#111d30;--box:#16213a;
  --blue:#00c8ff;--blue-dim:rgba(0,200,255,0.07);--blue-border:rgba(0,200,255,0.22);
  --border:#1a2d45;--white:#ffffff;--offwhite:#eaf3fb;--body-text:#cce2f2;
  --muted:#5a8aaa;
}
html{background:var(--bg);color:var(--white);font-size:16px;line-height:1.7}
body{background:var(--bg);min-height:100vh;font-family:'Lexend',sans-serif}
nav{background:var(--card);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 60px;position:sticky;top:0;z-index:100;width:100%}
.wordmark{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:4px;color:var(--white);text-decoration:none}
.wordmark span{color:var(--blue)}
.nav-lesson-id{font-family:'Lexend',sans-serif;font-size:13px;font-weight:300;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.nav-back{font-family:'Lexend',sans-serif;font-size:11px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:8px 18px;border-radius:3px;transition:color .2s,border-color .2s}
.nav-back:hover{color:var(--blue);border-color:var(--blue-border)}
.browser-shell{width:1280px;margin:0 auto}
.content-col{max-width:860px;margin:0 auto;padding:80px 0 100px;display:flex;flex-direction:column;align-items:center;gap:20px}
.placeholder-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
.placeholder-title{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;letter-spacing:3px;color:var(--white);text-transform:uppercase}
.placeholder-note{font-family:'Lexend',sans-serif;font-size:14px;font-weight:300;color:var(--muted);text-align:center;max-width:480px;line-height:1.7}
.cta-row{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:20px}
.mark-complete-btn{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--bg);background:var(--blue);border:none;border-radius:4px;padding:18px 52px;cursor:pointer;transition:opacity .2s,transform .15s;text-decoration:none;display:inline-block}
.mark-complete-btn:hover{opacity:0.88;transform:translateY(-1px)}
.cta-sub{font-family:'Lexend',sans-serif;font-size:12px;font-weight:300;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.prev-nav{border-top:1px solid var(--border);padding-top:40px;width:100%;display:flex;justify-content:flex-start}
.nav-btn{padding:18px 24px;background:var(--card);border:1px solid var(--border);border-radius:6px;text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,background .2s;max-width:280px}
.nav-btn:hover{border-color:var(--blue-border);background:var(--blue-dim)}
.nav-dir{font-family:'Lexend',sans-serif;font-size:10px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.nav-name{font-family:'Lexend',sans-serif;font-size:14px;font-weight:500;color:var(--white);line-height:1.4}
</style>
</head>
<body>
<nav>
  <a href="../hub-joshua.html" class="wordmark">NEXUS <span>ACADEMY</span></a>
  <div class="nav-lesson-id">Pre-Course — Challenge</div>
  <a href="../hub-joshua.html" class="nav-back">← Hub</a>
</nav>
<div class="browser-shell">
<div class="content-col">
  <div class="placeholder-label">Challenge</div>
  <div class="placeholder-title">Pre-Course Challenge</div>
  <div class="placeholder-note">Challenge content coming soon. When it's ready, this page will be updated with your scenario, steps, and deliverable.</div>
  <div class="cta-row">
    <a href="complete.html" class="mark-complete-btn">Mark Complete</a>
    <div class="cta-sub">Routes to module completion</div>
  </div>
  <div class="prev-nav">
    <a href="lesson-0-2.html" class="nav-btn">
      <span class="nav-dir">← Previous</span>
      <span class="nav-name">Getting Started with Notion</span>
    </a>
  </div>
</div>
</div>
</body>
</html>
