<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<!-- TEMPLATE: Module Intro Page -->

<title>NEXUS Academy — Module X Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Lexend:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08101f;--card:#0d1628;--card2:#111d30;--box:#16213a;
  --blue:#00c8ff;--blue-dim:rgba(0,200,255,0.07);--blue-border:rgba(0,200,255,0.22);
  --border:#1a2d45;--white:#ffffff;--offwhite:#eaf3fb;--body-text:#cce2f2;
  --muted:#5a8aaa;--label:#2a5a7a;--placeholder:#3a6888;
  --yellow:#ffcc00;--red:#ff4444;--amber:#ffaa00;
  --dot-color:#00c8ff;
}
html{background:var(--bg);color:var(--white);font-size:16px;line-height:1.7}
body{background:var(--bg);min-height:100vh;font-family:'Lexend',sans-serif}

nav{background:var(--card);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 60px;position:sticky;top:0;z-index:100;width:100%}
.wordmark{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:4px;color:var(--white);text-decoration:none}
.wordmark span{color:var(--blue)}
.nav-module-id{font-family:'Lexend',sans-serif;font-size:13px;font-weight:300;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.nav-back{font-family:'Lexend',sans-serif;font-size:11px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:8px 18px;border-radius:3px;transition:color .2s,border-color .2s}
.nav-back:hover{color:var(--blue);border-color:var(--blue-border)}

.browser-shell{width:1280px;margin:0 auto;background:var(--bg);min-height:calc(100vh - 64px)}
.content-col{max-width:860px;margin:0 auto;padding:52px 0 100px}

/* ── CIRO SCENE STAGE ── */
.ciro-scene-wrap{
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:8px 8px 0 0;
  background:var(--card);
  overflow:hidden;
  position:relative;
  height:280px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
}

/* scan line overlay */
.ciro-scene-wrap::after{
  content:'';
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,200,255,0.018) 3px,rgba(0,200,255,0.018) 4px);
  pointer-events:none;
}

.ciro-scene-floor{
  position:absolute;
  bottom:54px;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,200,255,0.18),transparent);
}

.ciro-stage{
  position:relative;
  will-change:transform;
  /* starts off-left — JS drives animation via inline style */
  transform:translateX(-200px);
}

/* ── CIRO SVG WRAPPER — rotates for head-turn & body pivot ── */
.ciro-svg-outer{
  display:block;
  transition:transform 0.0s; /* overridden by JS */
}

/* ── TRANSMISSION PANEL — flush below scene ── */
.ciro-tx-panel{
  border:1px solid var(--border);
  border-top:none;
  border-radius:0 0 8px 8px;
  background:var(--card2);
  padding:32px 40px 36px;
  position:relative;
}

/* top edge accent line */
.ciro-tx-panel::before{
  content:'';
  position:absolute;top:0;left:40px;right:40px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,200,255,0.35),transparent);
}

.tx-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:9px;
  letter-spacing:3px;
  color:var(--label);
  text-transform:uppercase;
  margin-bottom:18px;
}

.tx-name{
  font-family:'Orbitron',sans-serif;
  font-size:15px;
  font-weight:900;
  letter-spacing:4px;
  color:var(--blue);
  margin-bottom:22px;
}

#ciro-lines{}

.ciro-line{
  font-family:'IBM Plex Mono',monospace;
  font-size:15px;
  line-height:1.9;
  color:var(--offwhite);
  margin-bottom:22px;
  min-height:1.9em;
}

@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}

.tx-sep{
  height:1px;
  background:linear-gradient(90deg,var(--blue),transparent);
  opacity:0;
  margin:6px 0 28px;
  transition:opacity 0.8s ease;
  max-width:280px;
}
.tx-sep.visible{opacity:0.4}

/* ── BEGIN BUTTON ── */
.begin-btn{
  display:inline-flex;align-items:center;gap:12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--blue);
  background:transparent;
  border:1px solid var(--blue-border);
  border-radius:3px;
  padding:14px 32px;
  cursor:pointer;
  opacity:0;
  transform:translateY(8px);
  transition:opacity 0.7s ease,transform 0.7s ease,background 0.2s,border-color 0.2s;
  text-decoration:none;
  margin-top:4px;
}
.begin-btn.visible{opacity:1;transform:translateY(0);animation:btn-pulse 2s ease-in-out infinite}
.begin-btn:hover{background:var(--blue-dim);border-color:var(--blue);animation:none;box-shadow:0 0 18px rgba(0,200,255,0.35)}
@keyframes btn-pulse{
  0%,100%{border-color:rgba(0,200,255,0.22);box-shadow:0 0 0 rgba(0,200,255,0)}
  50%{border-color:rgba(0,200,255,0.9);box-shadow:0 0 14px rgba(0,200,255,0.4),0 0 28px rgba(0,200,255,0.15)}
}
.begin-arrow{transition:transform .2s}
.begin-btn:hover .begin-arrow{transform:translateX(5px)}

/* chest dot animations */
.da{animation:bl 2s infinite}
.db{animation:bl 2s .65s infinite}
.dc{animation:bl 2s 1.3s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0.2}}

/* ── MODULE BADGE (optional — shown in scene top-right) ── */
.scene-module-tag{
  position:absolute;top:20px;right:24px;
  font-family:'Orbitron',sans-serif;
  font-size:10px;letter-spacing:4px;
  color:rgba(0,200,255,0.4);
  text-transform:uppercase;
  pointer-events:none;
}
</style>
</head>
<body>

<nav>
  <!-- UPDATE: hub link per operator -->
  <a href="../hub-joshua.html" class="wordmark">NEXUS <span>ACADEMY</span></a>
  <!-- UPDATE: module number label -->
  <div class="nav-module-id">Welcome to Module X</div>
  <a href="../hub-joshua.html" class="nav-back">← Hub</a>
</nav>

<div class="browser-shell">
<div class="content-col">

  <!-- ══════════════════════════════════════════
       CIRO SCENE (top) + TRANSMISSION (bottom)
       These two blocks are flush — no gap between them
  ══════════════════════════════════════════ -->

  <div class="ciro-scene-wrap" id="ciro-scene">
    <div class="ciro-scene-floor"></div>

    <!-- CIRO moves along this track -->
    <div class="ciro-stage" id="ciro-stage">
      <!-- outer wrapper handles the full-body pivot -->
      <div class="ciro-svg-outer" id="ciro-body">
        <svg id="ciro-svg" width="86" height="178" viewBox="0 0 86 178">
          <!-- antenna -->
          <line x1="43" y1="3" x2="43" y2="14" stroke="#00c8ff" stroke-width="1.5"/>
          <circle cx="43" cy="2" r="2.5" fill="#00c8ff"/>

          <!-- HEAD (group — rotates for head-turn) -->
          <g id="ciro-head" style="transform-origin:43px 39px">
            <rect x="10" y="14" width="66" height="50" rx="4" fill="#0d1a2e" stroke="#00c8ff" stroke-width="1.2"/>
            <!-- transmission panel / screen -->
            <rect id="ciro-screen" x="16" y="20" width="54" height="38" rx="2" fill="#050f1c"/>
            <!-- scan lines on screen -->
            <line x1="18" y1="28" x2="70" y2="28" stroke="#00c8ff" stroke-width="0.5" opacity="0.55"/>
            <line x1="18" y1="35" x2="60" y2="35" stroke="#00c8ff" stroke-width="0.5" opacity="0.35"/>
            <line x1="18" y1="42" x2="66" y2="42" stroke="#00c8ff" stroke-width="0.5" opacity="0.25"/>
            <line x1="18" y1="49" x2="52" y2="49" stroke="#00c8ff" stroke-width="0.5" opacity="0.18"/>
          </g>

          <!-- neck connector -->
          <rect x="31" y="64" width="24" height="7" rx="2" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>

          <!-- TORSO -->
          <rect x="4" y="71" width="78" height="74" rx="5" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1.2"/>
          <!-- chest panel -->
          <rect x="15" y="82" width="56" height="32" rx="2" fill="#050f1c" stroke="#1e3a5a" stroke-width="1"/>
          <!-- three indicator dots -->
          <circle id="dot-a" cx="31" cy="96" r="4" fill="var(--dot-color)" class="da"/>
          <circle id="dot-b" cx="43" cy="96" r="4" fill="var(--dot-color)" class="db"/>
          <circle id="dot-c" cx="55" cy="96" r="4" fill="var(--dot-color)" class="dc"/>
          <!-- chest status bar -->
          <rect x="22" y="106" width="42" height="4" rx="2" fill="#1e3a5a"/>
          <!-- side panels -->
          <rect x="0" y="75" width="2" height="44" rx="1" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>
          <rect x="84" y="75" width="2" height="44" rx="1" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>

          <!-- LEGS -->
          <rect x="16" y="145" width="22" height="26" rx="3" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>
          <rect x="48" y="145" width="22" height="26" rx="3" fill="#0d1a2e" stroke="#1e3a5a" stroke-width="1"/>
          <!-- feet -->
          <rect x="13" y="165" width="28" height="6" rx="3" fill="#0a1525" stroke="#1e3a5a" stroke-width="1"/>
          <rect x="45" y="165" width="28" height="6" rx="3" fill="#0a1525" stroke="#1e3a5a" stroke-width="1"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- TRANSMISSION PANEL — flush below scene -->
  <div class="ciro-tx-panel">
    <div id="ciro-lines"></div>
    <div class="tx-sep" id="tx-sep"></div>
    <!-- UPDATE: href to first lesson of this module e.g. lesson-2-1.html -->
    <a href="lesson-X-1.html" class="begin-btn" id="begin-btn">
      Begin Module <span class="begin-arrow">→</span>
    </a>
  </div>

</div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   UPDATE THIS SECTION FOR EACH MODULE
   ═══════════════════════════════════════════════════════ */

/* Module-specific CIRO lines — paste from CIRO Messages doc */
const CIRO_LINES = [
  { text: "NEXUS ACADEMY is now transmitting.", pauseAfter: 800 },
  { text: "Operators in training, take note: timing is not a minor detail. Pay attention to what it means.", pauseAfter: 900 },
  { text: "Proceed.", pauseAfter: 400 },
];

/*
  LIGHT MODE — set to one of: 'blue' | 'full-sequence'
  'blue'          → Modules 2–6 (blue only, default)
  'full-sequence' → Module 1 only (white → yellow → red → blue)
*/
const LIGHT_MODE = 'blue';

/* ═══════════════════════════════════════════════════════
   ANIMATION ENGINE — do not edit below unless building a variant
   ═══════════════════════════════════════════════════════ */

const stage     = document.getElementById('ciro-stage');
const body      = document.getElementById('ciro-body');
const head      = document.getElementById('ciro-head');
const screen    = document.getElementById('ciro-screen');
const dotA      = document.getElementById('dot-a');
const dotB      = document.getElementById('dot-b');
const dotC      = document.getElementById('dot-c');
const linesEl   = document.getElementById('ciro-lines');
const txSep     = document.getElementById('tx-sep');
const beginBtn  = document.getElementById('begin-btn');

const SCENE_W   = document.getElementById('ciro-scene').offsetWidth;
const CIRO_W    = 86;
const TARGET_X  = Math.round(SCENE_W * 0.44); /* center-ish final position */

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

function setDotColor(color){
  dotA.setAttribute('fill', color);
  dotB.setAttribute('fill', color);
  dotC.setAttribute('fill', color);
  screen.setAttribute('fill', color === '#ffffff' ? '#1a2a3a' :
                               color === '#ffcc00' ? '#1a1500' :
                               color === '#ff4444' ? '#1a0000' : '#050f1c');
}

/* ── ROLL IN ── */
async function rollIn(){
  const startX  = -200;
  const duration = 1400;
  const start   = performance.now();

  /* bobble feet during roll */
  let legPhase = 0;

  function frame(now){
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    /* ease out cubic */
    const eased = 1 - Math.pow(1 - t, 3);
    const x = startX + (TARGET_X - startX) * eased;
    stage.style.transform = `translateX(${x}px)`;

    /* subtle vertical bob */
    const bob = Math.sin(elapsed / 90) * 2.2 * (1 - t * 0.6);
    stage.style.marginTop = `${bob}px`;

    if(t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  await wait(duration);
  stage.style.marginTop = '0px';
}

/* ── HEAD TURN (noticing us) ── */
async function headTurn(){
  /* slow tilt as if noticing */
  head.style.transition = 'transform 0.55s cubic-bezier(0.34,1.56,0.64,1)';
  head.style.transform  = 'rotate(-14deg)';
  await wait(420);
  head.style.transition = 'transform 0.35s ease-out';
  head.style.transform  = 'rotate(0deg)';
  await wait(350);
}

/* ── FULL BODY PIVOT (parallel park) ── */
async function bodyPivot(){
  const steps = [
    { deg: -6,  dur: 220 },
    { deg:  4,  dur: 180 },
    { deg: -2,  dur: 150 },
    { deg:  1,  dur: 130 },
    { deg:  0,  dur: 180 },
  ];
  for(const s of steps){
    body.style.transition = `transform ${s.dur}ms ease-in-out`;
    body.style.transform  = `rotate(${s.deg}deg)`;
    await wait(s.dur + 20);
  }
  body.style.transform = 'rotate(0deg)';
}

/* ── MODULE 1 FULL LIGHT SEQUENCE ── */
async function fullLightSequence(){
  /* white */
  setDotColor('#ffffff');
  await wait(900);
  /* yellow */
  setDotColor('#ffcc00');
  await wait(3200);
  /* red */
  setDotColor('#ff4444');
  await wait(5100);
  /* yellow brief */
  setDotColor('#ffcc00');
  await wait(3800);
  /* blue — settled */
  setDotColor('#00c8ff');
}

/* ── TYPE LINE ── */
async function typeLine(el, text){
  const cursor = document.createElement('span');
  cursor.style.cssText = 'display:inline-block;width:8px;height:14px;background:#00c8ff;vertical-align:middle;margin-left:2px;animation:cur .7s step-end infinite';
  el.appendChild(cursor);
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    el.insertBefore(document.createTextNode(ch), cursor);
    let d = 32;
    if(ch === '.') d += 110;
    else if(ch === ',') d += 55;
    else if(ch === '—') d += 70;
    else if(ch === ':') d += 50;
    await wait(d);
  }
  cursor.remove();
}

async function runTransmission(){
  await wait(600);
  for(const { text, pauseAfter } of CIRO_LINES){
    const lineEl = document.createElement('div');
    lineEl.className = 'ciro-line';
    linesEl.appendChild(lineEl);
    await typeLine(lineEl, text);
    await wait(pauseAfter);
  }
  await wait(350);
  txSep.classList.add('visible');
  await wait(500);
  beginBtn.classList.add('visible');
}

/* ── MAIN SEQUENCE ── */
async function runScene(){
  /* lights start white for module 1 full sequence */
  if(LIGHT_MODE === 'full-sequence'){
    setDotColor('#ffffff');
    /* run light sequence concurrently with roll-in + settle */
    fullLightSequence(); /* intentionally not awaited — runs in parallel */
  }

  await rollIn();
  await wait(280);
  await headTurn();
  await wait(180);
  await bodyPivot();
  await wait(400);

  /* begin transmission after scene settles */
  runTransmission();
}

runScene();
</script>
</body>
